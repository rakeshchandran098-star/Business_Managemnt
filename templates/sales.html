<!DOCTYPE html>
<html>
<head>
<title>Sales Management</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2>Sales Management</h2>

<a href="/dashboard" class="btn btn-dark mb-3">Dashboard</a>

<form method="POST" class="card p-3 mb-4">

    <label>Select Product</label>

    <select name="product" class="form-control mb-2" required>

        {% for p in products %}
            <option value="{{ p.name }}">
                {{ p.name }} - ₹{{ p.price }} (Stock: {{ p.stock }})
            </option>
        {% endfor %}

    </select>

    <input type="number" name="quantity"
    class="form-control mb-2" placeholder="Quantity"
    min="1" required>

    <button class="btn btn-primary">Record Sale</button>

</form>

<table class="table table-bordered bg-white">

<tr>
    <th>Sale ID</th>
    <th>Product</th>
    <th>Quantity</th>
    <th>Amount</th>
</tr>

{% for s in sales %}

<tr>
    <td>{{ s.id }}</td>
    <td>{{ s.product }}</td>
    <td>{{ s.quantity }}</td>
    <td>₹{{ s.amount }}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
