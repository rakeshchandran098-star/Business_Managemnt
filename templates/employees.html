<!DOCTYPE html>
<html>
<head>
<title>Employees</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2>Employee Management</h2>

<a href="/dashboard" class="btn btn-dark mb-3">Dashboard</a>

<form method="POST" class="card p-3 mb-4">

    <input name="name" class="form-control mb-2"
    placeholder="Employee Name" required>

    <input name="department" class="form-control mb-2"
    placeholder="Department" required>

    <input name="salary" type="number" step="0.01"
    class="form-control mb-2" placeholder="Salary" required>

    <button class="btn btn-primary">Add Employee</button>

</form>

<form method="GET" class="mb-3">

    <input name="search" class="form-control"
    placeholder="Search employee">

</form>

<table class="table table-bordered bg-white">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Department</th>
    <th>Salary</th>
    <th>Action</th>
</tr>

{% for emp in employees %}

<tr>

    <td>{{ emp.id }}</td>
    <td>{{ emp.name }}</td>
    <td>{{ emp.department }}</td>
    <td>{{ emp.salary }}</td>

    <td>
        <a href="/delete_employee/{{ emp.id }}"
        class="btn btn-danger btn-sm"
        onclick="return confirm('Delete this employee?')">
        Delete
        </a>
    </td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
