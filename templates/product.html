<!DOCTYPE html>
<html>
<head>
<title>Products</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2>Product Management</h2>

<a href="/dashboard" class="btn btn-dark mb-3">Dashboard</a>

<form method="POST" class="card p-3 mb-4">

    <input name="name" class="form-control mb-2"
    placeholder="Product Name" required>

    <input name="category" class="form-control mb-2"
    placeholder="Category" required>

    <input name="price" type="number" step="0.01"
    class="form-control mb-2" placeholder="Price" required>

    <input name="stock" type="number"
    class="form-control mb-2" placeholder="Stock" required>

    <button class="btn btn-success">Add Product</button>

</form>

<table class="table table-bordered bg-white">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Category</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Action</th>
</tr>

{% for p in products %}

<tr>

    <td>{{ p.id }}</td>
    <td>{{ p.name }}</td>
    <td>{{ p.category }}</td>
    <td>{{ p.price }}</td>
    <td>{{ p.stock }}</td>

    <td>
        <a href="/delete_product/{{ p.id }}"
        class="btn btn-danger btn-sm"
        onclick="return confirm('Delete this product?')">
        Delete
        </a>
    </td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
